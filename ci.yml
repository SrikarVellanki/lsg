name: ci

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests do not need torch/transformers (the classifier falls back to keywords),
      # so CI only installs pytest and stays fast.
      - run: pip install pytest
      - run: pytest
